# Fly.io: `fly launch --copy-config --no-deploy` once (pick a unique app name), then `fly deploy`.
# One machine in one region: the game state lives in memory, so it must not be split or scaled.
app = "lastword"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
